<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <!-- Темный фон со скруглением -->
  <rect width="32" height="32" rx="7" fill="#1e222b"/>
  
  <!-- Векторный градиент для мягкого свечения точки -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="1"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Буква D (Контурная) -->
  <path d="M9 8H14C17.5 8 20 10.2 20 14C20 17.8 17.5 20 14 20H9V8ZM11 10V18H13.8C16.2 18 17.8 16.5 17.8 14C17.8 11.5 16.2 10 13.8 10H11Z" fill="#22d3ee"/>

  <!-- Подсветка под точкой (мягкий расплывчатый круг) -->
  <circle cx="23" cy="20" r="3" fill="url(#glow)" opacity="0.6"/>
  
  <!-- Четкая акцентная точка -->
  <circle cx="23" cy="20" r="1.5" fill="#22d3ee"/>
</svg>
